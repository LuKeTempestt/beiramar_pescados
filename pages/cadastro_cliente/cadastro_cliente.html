<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="../../components/customPopups.js"></script>
    <script src="../../auth.js"></script>
    <script src="../../authGuard.js"></script>
    <script src="../../components/sidebar.js" defer></script>
    <link rel="stylesheet" href="../../global.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <title>Cadastro de Clientes</title>
</head>

<body>
    <div class="main-content">
        <div class="header">
            <h1>Cadastro de Clientes</h1>
            <p>Gerencie informações dos seus clientes</p>
        </div>

        <!-- Cards de Status -->
        <div class="dashboard-grid">
            <div class="card">
                <div class="card-icon">
                    <i class="fas fa-users" style="color: #3b82f6;"></i>
                </div>
                <div class="card-value" id="total-clientes">4</div>
                <div class="card-title">Total Clientes</div>
            </div>
            <div class="card">
                <div class="card-icon">
                    <i class="fas fa-building" style="color: #8b5cf6;"></i>
                </div>
                <div class="card-value" id="pessoa-juridica">3</div>
                <div class="card-title">Pessoa Jurídica</div>
            </div>
            <div class="card">
                <div class="card-icon">
                    <i class="fas fa-user" style="color: #06b6d4;"></i>
                </div>
                <div class="card-value" id="pessoa-fisica">1</div>
                <div class="card-title">Pessoa Física</div>
            </div>
            <div class="card">
                <div class="card-icon">
                    <i class="fas fa-user-check" style="color: #10b981;"></i>
                </div>
                <div class="card-value" id="clientes-ativos">4</div>
                <div class="card-title">Ativos</div>
            </div>
        </div>

        <div style="display:flex; justify-content:flex-end; margin-bottom: 10px;">
            <button class="btn small black" id="cadastrar-cliente-btn">＋ Cadastrar Cliente</button>
        </div>

        <!-- Lista de Clientes -->
        <div class="table-section">
            <div class="filter-bar">
                <input type="text" placeholder="🔍 Buscar clientes..." class="search-input" id="search-clientes">
            </div>

            <table class="data-table">
                <thead>
                    <tr>
                        <th>Cliente</th>
                        <th>Contato</th>
                        <th>Localização</th>
                        <th>Tipo</th>
                        <th>Status</th>
                        <th>Pedidos</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody id="clientes-body">
                    <!-- Os clientes serão carregados dinamicamente aqui pelo JS-->
                </tbody>
            </table>
        </div>
    </div>

    <!-- Popup para cadastrar/editar cliente -->
    <div id="popup-overlay-cliente" class="popup-overlay" style="display:none;">
        <div class="popup">
            <h2 id="popup-title-cliente">Cadastrar Cliente</h2>

            <label>Tipo de Cliente</label>
            <select id="cliente-tipo" class="styled-select">
                <option value="PJ">Pessoa Jurídica</option>
                <option value="PF">Pessoa Física</option>
            </select>

            <label>Nome/Razão Social</label>
            <input id="cliente-nome" type="text" class="search-input" placeholder="Nome completo ou razão social">

            <label id="label-documento">CNPJ</label>
            <input id="cliente-documento" type="text" class="search-input" placeholder="00.000.000/0000-00"
                maxlength="14">

            <label>Telefone</label>
            <input id="cliente-telefone" type="text" class="search-input" placeholder="(85) 99999-9999" maxlength="11">

            <label>Email</label>
            <input id="cliente-email" type="email" class="search-input" placeholder="email@exemplo.com">

            <label>Endereço</label>
            <input id="cliente-endereco" type="text" class="search-input" placeholder="Rua, número, bairro">

            <label>Cidade</label>
            <input id="cliente-cidade" type="text" class="search-input" placeholder="Cidade">

            <label>Status</label>
            <select id="cliente-status" class="styled-select">
                <option value="Ativo">Ativo</option>
                <option value="Inativo">Inativo</option>
            </select>

            <div class="popup-buttons">
                <button id="salvar-cliente" class="save-btn">Salvar</button>
                <button id="cancelar-popup-cliente" class="cancel-btn">Cancelar</button>
            </div>
        </div>
    </div>

    <!-- Popup de visualização -->
    <div class="popup-overlay" id="view-overlay-cliente" style="display:none;">
        <div class="popup" role="dialog" aria-modal="true">
            <h3>Detalhes do Cliente</h3>
            <div id="view-content-cliente" style="white-space:pre-wrap;"></div>
            <div style="text-align:right; margin-top:12px;">
                <button id="view-close-cliente" class="cancel-btn">Fechar</button>
            </div>
        </div>
    </div>

    <app-sidebar></app-sidebar>

    <script src="clientes.js"></script>
</body>

</html>
